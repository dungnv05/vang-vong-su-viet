<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="goldGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="50%" stop-color="#f1c40f" />
      <stop offset="100%" stop-color="#b45309" />
    </linearGradient>
    <linearGradient id="bladeMetal" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#cbd5e1" />
      <stop offset="50%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#94a3b8" />
    </linearGradient>
    <radialGradient id="aura" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fef08a" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#f1c40f" stop-opacity="0" />
    </radialGradient>
  </defs>

  <rect width="512" height="512" fill="#0f172a" rx="32"/>
  <circle cx="256" cy="256" r="200" fill="url(#aura)" />

  <!-- Lưỡi Kiếm Thuận Thiên -->
  <path d="M256 60 L280 340 L256 360 L232 340 Z" fill="url(#bladeMetal)" stroke="#f1c40f" stroke-width="3"/>
  <line x1="256" y1="60" x2="256" y2="340" stroke="#fef08a" stroke-width="2"/>

  <!-- Họa Tiết Rồng Thời Lê Trực Chìm Dọc Lưỡi Kiếm -->
  <path d="M256 120 Q265 160 256 200 Q247 240 256 280" stroke="url(#goldGlow)" stroke-width="4" fill="none" stroke-dasharray="6,4"/>

  <!-- Chuôi Kiếm & Quai Kiếm Hoa Sen Hoàng Gia -->
  <path d="M200 340 Q256 320 312 340 L290 365 Q256 355 222 365 Z" fill="url(#goldGlow)" />
  <rect x="246" y="365" width="20" height="70" rx="6" fill="#78350f" stroke="#f1c40f" stroke-width="2"/>
  <circle cx="256" cy="450" r="22" fill="url(#goldGlow)" stroke="#fff" stroke-width="2"/>
</svg>
